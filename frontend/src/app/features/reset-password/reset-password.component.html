<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-md w-full max-w-sm p-8">
    <h1 class="text-2xl font-bold text-indigo-600 text-center mb-6">💰 Budget</h1>

    @if (success()) {
      <div class="text-center">
        <p class="text-green-600 text-sm font-semibold mb-4">Password reset successfully. Redirecting to sign in…</p>
      </div>
    } @else if (!token()) {
      <div class="text-center">
        <p class="text-red-500 text-sm mb-4">{{ error() }}</p>
        <a routerLink="/forgot-password" class="text-indigo-600 hover:underline text-sm font-medium">Request a new link</a>
      </div>
    } @else {
      <form (ngSubmit)="onSubmit()" #f="ngForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">New password</label>
          <input
            type="password"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required
            autocomplete="new-password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Confirm new password</label>
          <input
            type="password"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
            required
            autocomplete="new-password"
            class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
          />
        </div>

        @if (error()) {
          <p class="text-red-500 text-sm text-center">{{ error() }}</p>
        }

        <button
          type="submit"
          [disabled]="loading() || f.invalid"
          class="w-full bg-indigo-600 text-white rounded-lg py-2 text-sm font-semibold hover:bg-indigo-700 transition-colors disabled:opacity-50"
        >
          {{ loading() ? 'Resetting…' : 'Reset password' }}
        </button>
      </form>

      <p class="text-sm text-gray-500 text-center mt-4">
        <a routerLink="/login" class="text-indigo-600 hover:underline font-medium">Back to sign in</a>
      </p>
    }
  </div>
</div>
